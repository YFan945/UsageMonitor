[package]
name = "kimimonitor"
version = "2.0.0"
description = "KimiMonitor Rust/Tauri 桌面版：读取本机会话日志，统计 Kimi Code 调用与 token 用量"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
